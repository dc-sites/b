<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asian Hub — Stream Exclusive Collections</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Watermark Styles */
    .watermark {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.2rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.4);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 10;
      transition: all 0.5s ease;
      user-select: none;
    }

    .watermark.moving {
      animation: watermarkMove 30s infinite alternate;
    }

    @keyframes watermarkMove {
      0% { top: 20px; right: 20px; }
      25% { top: 20px; left: 20px; right: auto; }
      50% { bottom: 80px; left: 20px; top: auto; right: auto; }
      75% { bottom: 80px; right: 20px; top: auto; }
      100% { top: 20px; right: 20px; }
    }

    /* Screenshot Restriction Overlay */
    .screenshot-blocker {
      position: absolute;
      inset: 0;
      background: transparent;
      z-index: 15;
      pointer-events: auto;
    }

    .screenshot-blocker.active {
      background: rgba(0, 0, 0, 0.01);
      mix-blend-mode: multiply;
    }

    /* PiP Button */
    .pip-btn {
      position: absolute;
      bottom: 60px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .player-box:hover .pip-btn {
      opacity: 1;
    }

    .pip-btn:hover {
      background: rgba(139, 92, 246, 0.9);
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="brand-logo">ASIAN <span>HUB</span></a>
    <div class="nav-actions">
      <input type="text" id="searchInput" class="search-input" placeholder="Search titles..." />
      <button id="themeToggle" class="icon-btn" title="Toggle Theme">☀️</button>
      <a href="admin.html" class="icon-btn">Admin</a>
    </div>
  </nav>

  <!-- Hero Spotlight -->
  <section class="hero" id="heroSection">
    <span class="hero-badge" id="heroCollection">Featured Premiere</span>
    <h1 id="heroTitle">Welcome to Asian Hub</h1>
    <p id="heroDesc">Curated HD cinema and exclusive video collections streaming seamlessly.</p>
    <button class="btn-primary" id="heroPlayBtn" style="display:none;">▶ Watch Now</button>
  </section>

  <!-- Collection Filter Pills -->
  <div class="collections-bar" id="collectionsBar">
    <button class="pill active" data-collection="ALL">All Videos</button>
  </div>

  <!-- Main Video Grid -->
  <main class="container">
    <div class="section-header">
      <h2 id="gridHeading">Latest Releases</h2>
      <span id="videoCount" style="color: var(--text-secondary); font-size: 0.875rem;"></span>
    </div>

    <div class="video-grid" id="videoGrid"></div>

    <div class="load-more-wrap">
      <button id="seeMoreBtn" class="icon-btn" style="padding: 0.75rem 2rem; display: none;">
        See More Videos ↓
      </button>
    </div>
  </main>

  <!-- Anti-Download Theater Modal -->
  <div class="modal" id="playerModal">
    <div class="modal-content">
      <div class="player-box" oncontextmenu="return false;">
        <video
          id="theaterVideo"
          controls
          controlsList="nodownload noplaybackrate"
          playsinline
          oncontextmenu="return false;"
          ondragstart="return false;"
          onselectstart="return false;"
        ></video>
        <div class="watermark" id="videoWatermark">asianx.site</div>
        <div class="screenshot-blocker" id="screenshotBlocker"></div>
        <button class="pip-btn" id="pipBtn" title="Picture-in-Picture">📺 PiP</button>
      </div>
      <div class="modal-info">
        <div>
          <span class="card-tag" id="modalCollection">Collection</span>
          <h2 id="modalTitle" style="margin: 0.25rem 0 0.5rem;">Video Title</h2>
          <p id="modalDesc" style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5;"></p>
        </div>
        <button class="icon-btn" id="closeModalBtn">✕ Close</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js";
    import {
      getFirestore,
      collection,
      getDocs,
      query,
      orderBy,
      limit,
      startAfter,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAEdEpK8B4WGR0iYZL5GKR20Q5p1MCU2l4",
      authDomain: "asianhub-9f45c.firebaseapp.com",
      projectId: "asianhub-9f45c",
      storageBucket: "asianhub-9f45c.firebasestorage.app",
      messagingSenderId: "297225882992",
      appId: "1:297225882992:web:59a3b7212c3ca2cdd1d3b5",
      measurementId: "G-8RYD4W7YBB"
    };

    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const db = getFirestore(app);

    // 1. Dark / Light Mode Logic
    const themeToggle = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem("asianhub_theme") || "dark";
    document.documentElement.setAttribute("data-theme", savedTheme);
    themeToggle.textContent = savedTheme === "dark" ? "☀️" : "🌙";

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("asianhub_theme", next);
      themeToggle.textContent = next === "dark" ? "☀️" : "🌙";
    });

    // 2. State Variables
    const PAGE_SIZE = 8;
    let lastVisibleDoc = null;
    let activeCollection = "ALL";
    let loadedVideos = [];

    const videoGrid = document.getElementById("videoGrid");
    const seeMoreBtn = document.getElementById("seeMoreBtn");
    const collectionsBar = document.getElementById("collectionsBar");

    // Player elements
    const theaterVideo = document.getElementById("theaterVideo");
    const watermark = document.getElementById("videoWatermark");
    const screenshotBlocker = document.getElementById("screenshotBlocker");
    const pipBtn = document.getElementById("pipBtn");

    // Helper: Get direct video URL
    function getStreamUrl(video) {
      return (video.videoUrl || video.r2Key || "").trim();
    }

    // Load player settings from Firestore
    async function loadPlayerSettings() {
      try {
        const settingsDoc = await getDoc(doc(db, "settings", "playerSettings"));
        if (settingsDoc.exists()) {
          const settings = settingsDoc.data();
          watermark.textContent = settings.watermarkText || "asianx.site";
          if (settings.screenshotRestriction) {
            screenshotBlocker.classList.add("active");
          } else {
            screenshotBlocker.classList.remove("active");
          }
        }
      } catch (err) {
        console.error("Failed to load player settings:", err);
      }
    }

    // 3. Build Collection Filter Pills
    function refreshCollectionPills() {
      const names = [...new Set(loadedVideos.map(v => v.collection).filter(Boolean))];
      collectionsBar.innerHTML = `<button class="pill ${activeCollection === "ALL" ? "active" : ""}" data-collection="ALL">All Videos</button>`;
      names.forEach((name) => {
        const btn = document.createElement("button");
        btn.className = `pill ${activeCollection === name ? "active" : ""}`;
        btn.dataset.collection = name;
        btn.textContent = name;
        collectionsBar.appendChild(btn);
      });
    }

    collectionsBar.addEventListener("click", (e) => {
      if (!e.target.classList.contains("pill")) return;
      activeCollection = e.target.dataset.collection;
      document.getElementById("gridHeading").textContent =
        activeCollection === "ALL" ? "Latest Releases" : activeCollection;
      resetAndLoadVideos();
    });

    // 4. Fetch Videos
    async function fetchVideos(isNextPage = false) {
      seeMoreBtn.textContent = "Loading...";
      seeMoreBtn.disabled = true;

      try {
        const isFiltered = activeCollection !== "ALL";
        const fetchLimit = isFiltered ? 100 : PAGE_SIZE;
        
        let constraints = [orderBy("createdAt", "desc"), limit(fetchLimit)];
        if (isNextPage && lastVisibleDoc) {
          constraints.push(startAfter(lastVisibleDoc));
        }

        const q = query(collection(db, "videos"), ...constraints);
        const snapshot = await getDocs(q);

        let fetchedDocs = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));

        if (isFiltered) {
          const targetCollection = activeCollection.trim().toLowerCase();
          fetchedDocs = fetchedDocs.filter(v => (v.collection || "").trim().toLowerCase() === targetCollection);
        }

        if (fetchedDocs.length > 0) {
          lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
          
          fetchedDocs.forEach((data) => {
            if (!loadedVideos.some(v => v.id === data.id)) {
              loadedVideos.push(data);
              renderVideoCard(data);
            }
          });

          refreshCollectionPills();

          if (!isNextPage && loadedVideos.length > 0) {
            setHero(loadedVideos[0]);
          }
        } else if (!isNextPage) {
          videoGrid.innerHTML = `<p style="color: var(--text-secondary);">No videos published in this category yet.</p>`;
        }

        seeMoreBtn.style.display = snapshot.size === fetchLimit ? "inline-block" : "none";

      } catch (err) {
        console.error("Failed to load videos:", err);
        let errorMsg = err.message || "Unknown error";
        if (errorMsg.includes("index")) {
          errorMsg = "Missing database index. Please check the browser console (F12) for a Firebase link to create it.";
        }
        videoGrid.innerHTML = `<p style="color: var(--danger);">Could not load videos: ${escapeHtml(errorMsg)}</p>`;
      } finally {
        seeMoreBtn.textContent = "See More Videos ↓";
        seeMoreBtn.disabled = false;
        document.getElementById("videoCount").textContent = `${loadedVideos.length} loaded`;
      }
    }

    function resetAndLoadVideos() {
      videoGrid.innerHTML = "";
      loadedVideos = [];
      lastVisibleDoc = null;
      fetchVideos(false);
    }

    function setHero(video) {
      document.getElementById("heroCollection").textContent = video.collection || "Featured";
      document.getElementById("heroTitle").textContent = video.title || "Untitled";
      document.getElementById("heroDesc").textContent = video.description || "";
      const playBtn = document.getElementById("heroPlayBtn");
      playBtn.style.display = "inline-block";
      playBtn.onclick = () => openPlayer(video);
    }

    function renderVideoCard(video) {
      const streamUrl = getStreamUrl(video);
      const card = document.createElement("article");
      card.className = "video-card";
      card.innerHTML = `
        <div class="thumb-wrapper">
          ${video.posterUrl
            ? `<img src="${escapeHtml(video.posterUrl)}" alt="${escapeHtml(video.title || "")}" style="width:100%; height:100%; object-fit:cover;" />`
            : `<video src="${escapeHtml(streamUrl)}#t=1.5" preload="metadata" muted playsinline controlsList="nodownload" oncontextmenu="return false;" ondragstart="return false;"></video>`
          }
          <div class="play-overlay">
            <div class="play-circle">▶</div>
          </div>
        </div>
        <div class="card-body">
          <span class="card-tag">${escapeHtml(video.collection || "General")}</span>
          <h3 class="card-title">${escapeHtml(video.title || "Untitled")}</h3>
          <p class="card-desc">${escapeHtml(video.description || "")}</p>
        </div>
      `;
      card.addEventListener("click", () => openPlayer(video));
      videoGrid.appendChild(card);
    }

    // 5. Theater Player Modal Controls
    const modal = document.getElementById("playerModal");

    function openPlayer(video) {
      theaterVideo.src = getStreamUrl(video);
      theaterVideo.setAttribute('controlsList', 'nodownload noplaybackrate');
      
      document.getElementById("modalCollection").textContent = video.collection || "General";
      document.getElementById("modalTitle").textContent = video.title || "Untitled";
      document.getElementById("modalDesc").textContent = video.description || "";
      modal.classList.add("open");
      
      // Start watermark animation
      watermark.classList.add("moving");
      
      theaterVideo.play().catch((err) => {
        console.error("Playback error:", err);
      });
    }

    function closePlayer() {
      theaterVideo.pause();
      theaterVideo.removeAttribute("src");
      theaterVideo.load();
      modal.classList.remove("open");
      watermark.classList.remove("moving");
      
      // Exit PiP if active
      if (document.pictureInPictureElement) {
        document.exitPictureInPicture().catch(err => console.error(err));
      }
    }

    document.getElementById("closeModalBtn").addEventListener("click", closePlayer);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closePlayer();
    });

    // PiP Button
    pipBtn.addEventListener("click", async () => {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (theaterVideo.readyState >= 2) {
          await theaterVideo.requestPictureInPicture();
        }
      } catch (err) {
        console.error("PiP error:", err);
        alert("Picture-in-Picture is not supported or the video is not ready.");
      }
    });

    // 6. Live Search Filter
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const term = e.target.value.toLowerCase();
      videoGrid.innerHTML = "";
      loadedVideos
        .filter(v =>
          (v.title || "").toLowerCase().includes(term) ||
          (v.description || "").toLowerCase().includes(term)
        )
        .forEach(renderVideoCard);
    });

    seeMoreBtn.addEventListener("click", () => fetchVideos(true));

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Initialize
    loadPlayerSettings();
    fetchVideos(false);
  </script>
</body>
</html>
