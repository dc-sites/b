<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asian Hub — Stream Exclusive Collections</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body oncontextmenu="return false;">

  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="brand-logo">ASIAN <span>HUB</span></a>
    <div class="nav-actions">
      <input type="text" id="searchInput" class="search-input" placeholder="Search titles..." />
      <button id="themeToggle" class="icon-btn" title="Toggle Theme">☀️</button>
      <a href="admin.html" class="icon-btn">Admin</a>
    </div>
  </nav>

  <!-- Hero Spotlight -->
  <section class="hero" id="heroSection">
    <span class="hero-badge" id="heroCollection">Featured Premiere</span>
    <h1 id="heroTitle">Welcome to Asian Hub</h1>
    <p id="heroDesc">Curated HD cinema and exclusive video collections streaming seamlessly.</p>
    <button class="btn-primary" id="heroPlayBtn" style="display:none;">▶ Watch Now</button>
  </section>

  <!-- Collection Filter Pills -->
  <div class="collections-bar" id="collectionsBar">
    <button class="pill active" data-collection="ALL">All Videos</button>
  </div>

  <!-- Main Video Grid -->
  <main class="container">
    <div class="section-header">
      <h2 id="gridHeading">Latest Releases</h2>
      <span id="videoCount" style="color: var(--text-secondary); font-size: 0.875rem;"></span>
    </div>
    <div class="video-grid" id="videoGrid"></div>
    <div class="load-more-wrap">
      <button id="seeMoreBtn" class="icon-btn" style="padding: 0.75rem 2rem; display: none;">See More Videos ↓</button>
    </div>
  </main>

  <!-- Professional Theater Modal -->
  <div class="modal" id="playerModal">
    <div class="modal-content">
      <div class="player-box" id="playerBox" oncontextmenu="return false;">
        <video id="theaterVideo" playsinline preload="metadata"></video>

        <!-- Watermark Overlay -->
        <div class="watermark" id="watermark">asianx.site</div>

        <!-- Screenshot Protection Overlay -->
        <div class="screenshot-guard" id="screenshotGuard"></div>

        <!-- Custom Controls (always visible, no auto-hide) -->
        <div class="custom-controls" id="customControls">
          <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar">
              <div class="progress-buffered" id="progressBuffered"></div>
              <div class="progress-filled" id="progressFilled"></div>
            </div>
          </div>
          <div class="controls-row">
            <button class="ctrl-btn" id="playPauseBtn" title="Play/Pause (Space)">▶</button>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" title="Volume" />
            <div class="time-display">
              <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
            </div>
            <div class="controls-spacer"></div>
            <button class="ctrl-btn" id="pipBtn" title="Picture-in-Picture">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg>
            </button>
            <button class="ctrl-btn" id="fullscreenBtn" title="Fullscreen (F)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="modal-info">
        <div>
          <span class="card-tag" id="modalCollection">Collection</span>
          <h2 id="modalTitle" style="margin: 0.25rem 0 0.5rem;">Video Title</h2>
          <p id="modalDesc" style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5;"></p>
        </div>
        <button class="icon-btn" id="closeModalBtn">✕ Close</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js";
    import {
      getFirestore, collection, getDocs, query, orderBy, limit, startAfter, doc, getDoc
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAEdEpK8B4WGR0iYZL5GKR20Q5p1MCU2l4",
      authDomain: "asianhub-9f45c.firebaseapp.com",
      projectId: "asianhub-9f45c",
      storageBucket: "asianhub-9f45c.firebasestorage.app",
      messagingSenderId: "297225882992",
      appId: "1:297225882992:web:59a3b7212c3ca2cdd1d3b5",
      measurementId: "G-8RYD4W7YBB"
    };

    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const db = getFirestore(app);

    // ============ Theme Toggle ============
    const themeToggle = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem("asianhub_theme") || "dark";
    document.documentElement.setAttribute("data-theme", savedTheme);
    themeToggle.textContent = savedTheme === "dark" ? "☀️" : "🌙";

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("asianhub_theme", next);
      themeToggle.textContent = next === "dark" ? "☀️" : "🌙";
    });

    // ============ State Variables ============
    const PAGE_SIZE = 8;
    let lastVisibleDoc = null;
    let activeCollection = "ALL";
    let loadedVideos = [];

    const videoGrid = document.getElementById("videoGrid");
    const seeMoreBtn = document.getElementById("seeMoreBtn");
    const collectionsBar = document.getElementById("collectionsBar");

    function getStreamUrl(video) {
      return (video.videoUrl || video.r2Key || "").trim();
    }

    // ============ Collection Pills ============
    function refreshCollectionPills() {
      const names = [...new Set(loadedVideos.map(v => v.collection).filter(Boolean))];
      collectionsBar.innerHTML = `<button class="pill ${activeCollection === "ALL" ? "active" : ""}" data-collection="ALL">All Videos</button>`;
      names.forEach((name) => {
        const btn = document.createElement("button");
        btn.className = `pill ${activeCollection === name ? "active" : ""}`;
        btn.dataset.collection = name;
        btn.textContent = name;
        collectionsBar.appendChild(btn);
      });
    }

    collectionsBar.addEventListener("click", (e) => {
      if (!e.target.classList.contains("pill")) return;
      activeCollection = e.target.dataset.collection;
      document.getElementById("gridHeading").textContent =
        activeCollection === "ALL" ? "Latest Releases" : activeCollection;
      resetAndLoadVideos();
    });

    // ============ Fetch Videos ============
    async function fetchVideos(isNextPage = false) {
      seeMoreBtn.textContent = "Loading...";
      seeMoreBtn.disabled = true;

      try {
        const isFiltered = activeCollection !== "ALL";
        const fetchLimit = isFiltered ? 100 : PAGE_SIZE;
        let constraints = [orderBy("createdAt", "desc"), limit(fetchLimit)];
        if (isNextPage && lastVisibleDoc) constraints.push(startAfter(lastVisibleDoc));

        const q = query(collection(db, "videos"), ...constraints);
        const snapshot = await getDocs(q);
        let fetchedDocs = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));

        if (isFiltered) {
          const target = activeCollection.trim().toLowerCase();
          fetchedDocs = fetchedDocs.filter(v => (v.collection || "").trim().toLowerCase() === target);
        }

        if (fetchedDocs.length > 0) {
          lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
          fetchedDocs.forEach((data) => {
            if (!loadedVideos.some(v => v.id === data.id)) {
              loadedVideos.push(data);
              renderVideoCard(data);
            }
          });
          refreshCollectionPills();
          if (!isNextPage && loadedVideos.length > 0) setHero(loadedVideos[0]);
        } else if (!isNextPage) {
          videoGrid.innerHTML = `<p style="color: var(--text-secondary);">No videos published in this category yet.</p>`;
        }

        seeMoreBtn.style.display = snapshot.size === fetchLimit ? "inline-block" : "none";
      } catch (err) {
        console.error("Failed to load videos:", err);
        videoGrid.innerHTML = `<p style="color: var(--text-secondary);">Could not load videos.</p>`;
      } finally {
        seeMoreBtn.textContent = "See More Videos ↓";
        seeMoreBtn.disabled = false;
        document.getElementById("videoCount").textContent = `${loadedVideos.length} loaded`;
      }
    }

    function resetAndLoadVideos() {
      videoGrid.innerHTML = "";
      loadedVideos = [];
      lastVisibleDoc = null;
      fetchVideos(false);
    }

    function setHero(video) {
      document.getElementById("heroCollection").textContent = video.collection || "Featured";
      document.getElementById("heroTitle").textContent = video.title || "Untitled";
      document.getElementById("heroDesc").textContent = video.description || "";
      const playBtn = document.getElementById("heroPlayBtn");
      playBtn.style.display = "inline-block";
      playBtn.onclick = () => openPlayer(video);
    }

    function renderVideoCard(video) {
      const streamUrl = getStreamUrl(video);
      const card = document.createElement("article");
      card.className = "video-card";
      card.innerHTML = `
        <div class="thumb-wrapper">
          ${video.posterUrl
            ? `<img src="${escapeHtml(video.posterUrl)}" alt="${escapeHtml(video.title || "")}" style="width:100%; height:100%; object-fit:cover;" />`
            : `<video src="${escapeHtml(streamUrl)}#t=1.5" preload="metadata" muted playsinline controlsList="nodownload" oncontextmenu="return false;" ondragstart="return false;"></video>`
          }
          <div class="play-overlay">
            <div class="play-circle">▶</div>
          </div>
        </div>
        <div class="card-body">
          <span class="card-tag">${escapeHtml(video.collection || "General")}</span>
          <h3 class="card-title">${escapeHtml(video.title || "Untitled")}</h3>
          <p class="card-desc">${escapeHtml(video.description || "")}</p>
        </div>
      `;
      card.addEventListener("click", () => openPlayer(video));
      videoGrid.appendChild(card);
    }

    // ============ Professional Player Logic (Optimized) ============
    const modal = document.getElementById("playerModal");
    const playerBox = document.getElementById("playerBox");
    const theaterVideo = document.getElementById("theaterVideo");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const progressContainer = document.getElementById("progressContainer");
    const progressBar = document.getElementById("progressBar");
    const progressFilled = document.getElementById("progressFilled");
    const progressBuffered = document.getElementById("progressBuffered");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const pipBtn = document.getElementById("pipBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const watermark = document.getElementById("watermark");
    const screenshotGuard = document.getElementById("screenshotGuard");

    let watermarkInterval = null;
    let playerSettings = {
      watermarkText: "asianx.site",
      screenshotProtection: false
    };

    // Load player settings from Firestore
    async function loadPlayerSettings() {
      try {
        const settingsDoc = await getDoc(doc(db, "settings", "playerSettings"));
        if (settingsDoc.exists()) {
          const data = settingsDoc.data();
          playerSettings.watermarkText = data.watermarkText || "asianx.site";
          playerSettings.screenshotProtection = !!data.screenshotProtection;
        }
      } catch (err) {
        console.warn("Could not load player settings, using defaults.", err);
      }
      applyPlayerSettings();
    }

    function applyPlayerSettings() {
      watermark.textContent = playerSettings.watermarkText;
      startWatermarkMovement();

      if (playerSettings.screenshotProtection) {
        screenshotGuard.style.display = "block";
        playerBox.classList.add("protected");
      } else {
        screenshotGuard.style.display = "none";
        playerBox.classList.remove("protected");
      }
    }

    // Watermark Movement
    function startWatermarkMovement() {
      if (watermarkInterval) clearInterval(watermarkInterval);

      const positions = [
        { top: '20px', left: '20px', transform: 'none' },
        { top: '20px', right: '20px', left: 'auto', transform: 'none' },
        { bottom: '90px', left: '20px', top: 'auto', transform: 'none' },
        { bottom: '90px', right: '20px', top: 'auto', left: 'auto', transform: 'none' },
        { top: '45%', left: '50%', transform: 'translate(-50%, -50%)' },
        { top: '25%', left: '30%', transform: 'none' },
        { top: '65%', right: '25%', left: 'auto', transform: 'none' },
        { top: '35%', right: '35%', left: 'auto', transform: 'none' },
      ];

      let idx = 0;
      const applyPos = () => {
        const p = positions[idx];
        watermark.style.top = p.top || 'auto';
        watermark.style.bottom = p.bottom || 'auto';
        watermark.style.left = p.left || 'auto';
        watermark.style.right = p.right || 'auto';
        watermark.style.transform = p.transform;
        idx = (idx + 1) % positions.length;
      };

      applyPos();
      watermarkInterval = setInterval(applyPos, 4500);
    }

    // Format time helper
    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // Play/Pause
    function togglePlay() {
      if (theaterVideo.paused) theaterVideo.play();
      else theaterVideo.pause();
    }

    playPauseBtn.addEventListener("click", togglePlay);

    theaterVideo.addEventListener("play", () => {
      playPauseBtn.textContent = "❚❚";
    });

    theaterVideo.addEventListener("pause", () => {
      playPauseBtn.textContent = "▶";
    });

    // Time & Progress (OPTIMIZED: throttled updates)
    let lastTimeUpdate = 0;
    theaterVideo.addEventListener("timeupdate", () => {
      const now = Date.now();
      if (now - lastTimeUpdate < 200) return; // Throttle to 5 updates per second
      lastTimeUpdate = now;

      const pct = (theaterVideo.currentTime / theaterVideo.duration) * 100 || 0;
      progressFilled.style.width = pct + "%";
      currentTimeEl.textContent = formatTime(theaterVideo.currentTime);
    });

    theaterVideo.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(theaterVideo.duration);
    });

    theaterVideo.addEventListener("progress", () => {
      if (theaterVideo.buffered.length > 0) {
        const buffered = theaterVideo.buffered.end(theaterVideo.buffered.length - 1);
        const pct = (buffered / theaterVideo.duration) * 100 || 0;
        progressBuffered.style.width = pct + "%";
      }
    });

    progressContainer.addEventListener("click", (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      theaterVideo.currentTime = pct * theaterVideo.duration;
    });

    // Volume (simple, no dynamic icon)
    volumeSlider.addEventListener("input", (e) => {
      theaterVideo.volume = e.target.value;
      theaterVideo.muted = e.target.value == 0;
    });

    // Picture-in-Picture
    pipBtn.addEventListener("click", async () => {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
          await theaterVideo.requestPictureInPicture();
        }
      } catch (err) {
        console.warn("PiP not supported:", err);
      }
    });

    // Fullscreen with Auto-Landscape on Mobile
    fullscreenBtn.addEventListener("click", async () => {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
        // Restore portrait on mobile when exiting fullscreen
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.unlock();
        }
      } else {
        try {
          // Try to lock to landscape on mobile BEFORE entering fullscreen
          if (screen.orientation && screen.orientation.lock) {
            try {
              await screen.orientation.lock("landscape");
            } catch (e) {
              console.warn("Orientation lock failed:", e);
            }
          }
          await playerBox.requestFullscreen();
        } catch (err) {
          console.warn("Fullscreen failed:", err);
        }
      }
    });

    document.addEventListener("fullscreenchange", () => {
      const isFS = !!document.fullscreenElement;
      fullscreenBtn.innerHTML = isFS
        ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>`
        : `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>`;
    });

    // Keyboard Shortcuts (simplified)
    document.addEventListener("keydown", (e) => {
      if (!modal.classList.contains("open")) return;
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;

      switch (e.key.toLowerCase()) {
        case " ":
        case "k":
          e.preventDefault();
          togglePlay();
          break;
        case "arrowleft":
          e.preventDefault();
          theaterVideo.currentTime = Math.max(0, theaterVideo.currentTime - 10);
          break;
        case "arrowright":
          e.preventDefault();
          theaterVideo.currentTime = Math.min(theaterVideo.duration, theaterVideo.currentTime + 10);
          break;
        case "arrowup":
          e.preventDefault();
          theaterVideo.volume = Math.min(1, theaterVideo.volume + 0.1);
          volumeSlider.value = theaterVideo.volume;
          break;
        case "arrowdown":
          e.preventDefault();
          theaterVideo.volume = Math.max(0, theaterVideo.volume - 0.1);
          volumeSlider.value = theaterVideo.volume;
          break;
        case "m":
          theaterVideo.muted = !theaterVideo.muted;
          break;
        case "f":
          fullscreenBtn.click();
          break;
        case "p":
          pipBtn.click();
          break;
      }

      // Screenshot protection - block PrintScreen
      if (playerSettings.screenshotProtection && e.key === "PrintScreen") {
        e.preventDefault();
        navigator.clipboard.writeText("").catch(() => {});
      }
    });

    // Open/Close Player
    function openPlayer(video) {
      theaterVideo.src = getStreamUrl(video);
      theaterVideo.setAttribute('controlsList', 'nodownload noplaybackrate');
      document.getElementById("modalCollection").textContent = video.collection || "General";
      document.getElementById("modalTitle").textContent = video.title || "Untitled";
      document.getElementById("modalDesc").textContent = video.description || "";
      modal.classList.add("open");
      theaterVideo.play().catch(err => console.warn("Autoplay blocked:", err));
    }

    function closePlayer() {
      theaterVideo.pause();
      theaterVideo.removeAttribute("src");
      theaterVideo.load();
      modal.classList.remove("open");
      if (document.pictureInPictureElement) {
        document.exitPictureInPicture().catch(() => {});
      }
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
    }

    document.getElementById("closeModalBtn").addEventListener("click", closePlayer);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closePlayer();
    });

    // Live Search
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const term = e.target.value.toLowerCase();
      videoGrid.innerHTML = "";
      loadedVideos
        .filter(v =>
          (v.title || "").toLowerCase().includes(term) ||
          (v.description || "").toLowerCase().includes(term)
        )
        .forEach(renderVideoCard);
    });

    seeMoreBtn.addEventListener("click", () => fetchVideos(true));

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Initialize
    loadPlayerSettings();
    fetchVideos(false);
  </script>
</body>
</html>
